server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # the 2026 lineup/program moved to the archive
    location ~ ^/programm(\.html)?$ {
        return 301 /archiv-2026.html;
    }

    location / {
        # /impressum works like /impressum.html (same as npx serve locally)
        try_files $uri $uri.html $uri/ =404;
    }
}
