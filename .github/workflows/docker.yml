name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs on main are queued one at a time, so two pushes in quick succession can't pick the
# same version number. PR runs only build, so a newer push to the PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION=1
          else
            CURRENT_VERSION=${LATEST_TAG#v}
            NEXT_VERSION=$((CURRENT_VERSION + 1))
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION"

      # Reserve the version before pushing any image: if the tag already exists the run
      # stops here instead of overwriting an existing image tag.
      - name: Create git tag
        if: github.event_name != 'pull_request'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name to lowercase
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Production pins a numbered image tag in docker-compose.yml. Portainer's git stack only
      # redeploys when the repo has a new commit, so the new version is committed here.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this doesn't loop.
      - name: Point docker-compose.yml at the new image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E "s#^([[:space:]]*image:[[:space:]]*${IMAGE}:).*#\1${VERSION}#" docker-compose.yml
          grep -qE "^[[:space:]]*image:[[:space:]]*${IMAGE}:${VERSION}$" docker-compose.yml \
            || { echo "::error::image line for ${IMAGE} not found in docker-compose.yml"; exit 1; }
          if git diff --quiet docker-compose.yml; then
            echo "docker-compose.yml already on ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy v${VERSION} [skip ci]" docker-compose.yml
          git push origin main

      # Portainer stack webhook (Portainer 2.45): POST, no body, no query parameters.
      # It answers 204 right away and redeploys in the background (pull git, re-pull image).
      # 409 = a deployment of the stack is already running; retried a few times.
      - name: Trigger Portainer redeploy
        if: github.event_name != 'pull_request'
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::secret PORTAINER_WEBHOOK_URL is not set"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o response.txt -w '%{http_code}' -X POST --max-time 30 "$WEBHOOK_URL" || echo "000")
            echo "Attempt ${attempt}: HTTP ${status}"
            case "$status" in
              200|204) echo "Portainer accepted the redeploy."; exit 0 ;;
              409|000|5*) sleep 20 ;;
              *) break ;;
            esac
          done
          echo "::error::Portainer webhook failed with HTTP ${status}"
          cat response.txt || true
          exit 1
